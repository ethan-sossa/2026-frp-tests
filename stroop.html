<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stroop Test</title>

<style>
body{
    margin:0;
    background:#444444;
    color:white;
    font-family:system-ui,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

#container{
    width:90%;
    max-width:800px;
}

#stimulus{
    font-size:72px;
    font-weight:bold;
    margin:40px;
    user-select:none;
}

#info{
    font-size:22px;
    margin:20px;
}

#progress{
    margin-top:20px;
    font-size:18px;
}

button{
    font-size:20px;
    padding:12px 30px;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="container">

<h1>Stroop Test</h1>

<p id="instructions">
Press the key that matches the <b>COLOR</b> of the word.<br><br>

<b>R</b> = Red<br>
<b>G</b> = Green<br>
<b>B</b> = Blue<br>
<b>Y</b> = Yellow<br><br>

Ignore what the word says.
</p>

<button id="start">Start Test</button>

<div id="progress"></div>
<div id="stimulus"></div>
<div id="info"></div>

</div>

<script>

const COLORS = [
    {name:"RED", color:"red", key:"r"},
    {name:"GREEN", color:"limegreen", key:"g"},
    {name:"BLUE", color:"deepskyblue", key:"b"},
    {name:"YELLOW", color:"gold", key:"y"}
];

const TOTAL = 30;

let trial = 0;
let correct = 0;
let totalRT = 0;

let currentAnswer = "";
let startTime = 0;
let accepting = false;

document.getElementById("start").onclick = function(){

    this.style.display="none";
    document.getElementById("instructions").style.display="none";

    nextTrial();

};

function randomItem(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function nextTrial(){

    if(trial >= TOTAL){
        finish();
        return;
    }

    trial++;

    const word = randomItem(COLORS);
    const ink = randomItem(COLORS);

    document.getElementById("stimulus").textContent = word.name;
    document.getElementById("stimulus").style.color = ink.color;

    document.getElementById("progress").textContent =
        "Trial " + trial + " / " + TOTAL;

    document.getElementById("info").textContent = "";

    currentAnswer = ink.key;

    accepting = true;
    startTime = performance.now();

}

document.addEventListener("keydown",function(e){

    if(!accepting) return;

    const key = e.key.toLowerCase();

    if(!["r","g","b","y"].includes(key))
        return;

    accepting = false;

    const rt = Math.round(performance.now()-startTime);

    if(key === currentAnswer){

        correct++;
        totalRT += rt;

        document.getElementById("info").textContent =
            "✓ Correct (" + rt + " ms)";

    }else{

        document.getElementById("info").textContent =
            "✗ Incorrect";

    }

    setTimeout(nextTrial,500);

});

function finish(){

    document.getElementById("stimulus").textContent="Finished!";

    const avg =
        correct>0 ?
        Math.round(totalRT/correct) :
        0;

    const accuracy =
        Math.round(correct/TOTAL*100);

    document.getElementById("progress").innerHTML="";

    document.getElementById("info").innerHTML=
        "<h2>Results</h2>" +
        "<p><b>Correct:</b> " + correct + " / " + TOTAL + "</p>" +
        "<p><b>Accuracy:</b> " + accuracy + "%</p>" +
        "<p><b>Average Correct Reaction Time:</b> " + avg + " ms</p>" +
        '<button onclick="location.reload()">Try Again</button>';

}

</script>

</body>
</html>
