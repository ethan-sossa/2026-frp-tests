<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Time Test</title>

<style>
    body {
        margin: 0;
        font-family: system-ui, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #cc0000;
        color: white;
        text-align: center;
        user-select: none;
        cursor: pointer;;
    }

    #container {
        max-width: 700px;
        padding: 20px;
    }

    h1 {
        margin-top: 0;
    }

    #message {
        font-size: 2em;
        margin: 20px 0;
    }

    #round {
        font-size: 1.2em;
        opacity: 0.9;
    }

    button {
        padding: 12px 24px;
        font-size: 18px;
        cursor: pointer;
    }

    #results {
        margin-top: 20px;
        font-size: 1.2em;
    }
</style>
</head>

<body>

<div id="container">
    <h1>Reaction Time Test</h1>

    <p id="instructions">
        Click the button below to begin.<br><br>
        When the screen turns <strong>GREEN</strong>, click anywhere as quickly as possible.
        <br><br>
        If you click too early, that round restarts.
    </p>

    <button id="startBtn" style="font-family: system-ui;">Start Test</button>

    <div id="round"></div>
    <div id="message"></div>
    <div id="results"></div>
</div>

<script>

const TOTAL_ROUNDS = 10;

let round = 0;
let times = [];

let waiting = false;
let ready = false;
let startTime = 0;
let timeoutID = null;

const body = document.body;
const message = document.getElementById("message");
const roundText = document.getElementById("round");
const results = document.getElementById("results");
const startBtn = document.getElementById("startBtn");
const instructions = document.getElementById("instructions");

startBtn.onclick = startTest;

function startTest() {
    startBtn.style.display = "none";
    instructions.style.display = "none";
    times = [];
    round = 0;
    nextRound();
}

function nextRound() {

    round++;

    roundText.textContent = `Round ${round} of ${TOTAL_ROUNDS}`;
    results.innerHTML = "";

    body.style.background = "#cc0000";
    message.textContent = "Wait for GREEN...";

    waiting = true;
    ready = false;

    const delay = 2000 + Math.random() * 3000;

    timeoutID = setTimeout(() => {

        waiting = false;
        ready = true;

        body.style.background = "#00aa00";
        message.textContent = "CLICK!";

        startTime = performance.now();

    }, delay);

}

document.body.addEventListener("mousedown", function(e){

    if (e.target === startBtn)
        return;

    if (ready) {

        const reaction = Math.round(performance.now() - startTime);

        times.push(reaction);

        ready = false;

        body.style.background = "#0389ff";
        message.textContent = `Reaction Time: ${reaction} ms`;

        if (round < TOTAL_ROUNDS) {

            setTimeout(nextRound, 1500);

        } else {

            finish();

        }

    } else if (waiting) {

        clearTimeout(timeoutID);

        waiting = false;

        body.style.background = "#aa0000";
        message.innerHTML =
            "<strong>Too Soon!</strong><br>Wait for the green screen.<br>Restarting this round...";

        round--;

        setTimeout(nextRound, 1800);

    }

});

function finish() {

    const average =
        Math.round(times.reduce((a,b)=>a+b,0) / times.length);

    let html = "<h2>Results</h2>";
    html += '<ul style="list-style-type: none; padding-left: 0;">';

    times.forEach((t,i)=>{
        html += `<li>Round ${i+1}: <strong>${t} ms</strong></li>`;
    });
    html += '</ul>';

    html += `<h2>Average: ${average} ms</h2>`

    html += `<br><button onclick="location.reload()">Try Again</button>`;

    results.innerHTML = html;

    message.textContent = "Test Complete!";
    roundText.textContent = "";

    body.style.background = "#444444";

}

</script>

</body>
</html>
