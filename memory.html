<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory Test</title>

<style>
body{
    margin:0;
    font-family: system-ui,sans-serif;
    background:#444444;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

#container{
    max-width:800px;
    width:90%;
}

#digits{
    font-size:42px;
    letter-spacing:6px;
    margin:30px 0;
    font-family:monospace;
}

#timer{
    font-size:28px;
    margin:20px;
}

input{
    width:100%;
    font-size:28px;
    text-align:center;
    padding:10px;
    letter-spacing:5px;
}

button{
    padding:12px 30px;
    font-size:20px;
    cursor:pointer;
    margin-top:20px;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

td,th{
    border:1px solid #666;
    padding:8px;
}

.correct{
    color:#6df56d;
}

</style>
</head>
<body>

<div id="container">

<h1>Memory Test</h1>

<p>
You will be shown a 20-digit number for 20 seconds.<br>
Memorize it as well as you can.<br><br>
There are 3 rounds.
</p>

<div id="round"></div>

<div id="digits"></div>

<div id="timer"></div>

<div id="answerArea" style="display:none;">
<input id="answer" maxlength="20" autocomplete="off">
<br>
<button onclick="submitAnswer()">Submit</button>
</div>

<button id="start" onclick="startTest()">Start Test</button>

<div id="results"></div>

</div>

<script>

const TOTAL_ROUNDS = 3;
const LENGTH = 20;
const MEM_TIME = 20;

let round = 0;
let currentDigits = "";
let scores = [];

let countdown;

function randomDigits(length){

    let s="";

    for(let i=0;i<length;i++)
        s += Math.floor(Math.random()*10);

    return s;
}

function startTest(){

    document.getElementById("start").style.display="none";
    document.querySelector("p").style.display="none";

    nextRound();
}

function nextRound(){

    round++;

    document.getElementById("results").innerHTML="";
    document.getElementById("answerArea").style.display="none";

    document.getElementById("round").innerHTML=
        "<h2>Round "+round+" of "+TOTAL_ROUNDS+"</h2>";

    currentDigits=randomDigits(LENGTH);

    document.getElementById("digits").textContent=currentDigits;

    let time=MEM_TIME;

    document.getElementById("timer").textContent=
        "Time Remaining: "+time+" s";

    countdown=setInterval(function(){

        time--;

        document.getElementById("timer").textContent=
            "Time Remaining: "+time+" s";

        if(time<=0){

            clearInterval(countdown);

            document.getElementById("digits").textContent="";

            document.getElementById("timer").textContent=
                "Enter the digits you remember:";

            document.getElementById("answer").value="";

            document.getElementById("answerArea").style.display="block";

            document.getElementById("answer").focus();

        }

    },1000);

}

document.getElementById("answer").addEventListener("keydown",function(e){

    if(e.key==="Enter")
        submitAnswer();

});

function submitAnswer(){

    let guess=document.getElementById("answer").value.trim();

    let score=0;

    for(let i=0;i<LENGTH;i++){

        if(guess[i]===currentDigits[i])
            score++;

    }

    scores.push(score);

    document.getElementById("answerArea").style.display="none";

    document.getElementById("results").innerHTML=
        "<h2>Round Score: "+score+" / "+LENGTH+"</h2>"+
        "<p><b>Correct:</b><br>"+currentDigits+"</p>"+
        "<p><b>Your Answer:</b><br>"+guess+"</p>";

    if(round<TOTAL_ROUNDS){

        setTimeout(nextRound,4000);

    }else{

        finish();

    }

}

function finish(){

    let total=0;

    let html="<h2>Final Results</h2>";

    html+="<table>";

    html+="<tr><th>Round</th><th>Score</th></tr>";

    for(let i=0;i<scores.length;i++){

        total+=scores[i];

        html+="<tr><td>"+(i+1)+"</td><td>"+scores[i]+" / 20</td></tr>";

    }

    html+="</table>";

    html+="<h2>Average Score: "+(total/scores.length).toFixed(1)+" / 20</h2>";

    html+='<button onclick="location.reload()">Try Again</button>';

    document.getElementById("round").innerHTML="";
    document.getElementById("digits").innerHTML="";
    document.getElementById("timer").innerHTML="";
    document.getElementById("results").innerHTML=html;

}

</script>

</body>
</html>
